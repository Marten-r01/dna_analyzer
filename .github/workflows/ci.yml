name: Java CI with Gradle

on:
  push:
    branches: 
        - master
  pull_request:
    branches: 
        - master

jobs:
  build:
    
    runs-on: windows-10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: chmod for Gradle Wrapper
      run: chmod +x ./gradlew
        
    - name: Build project
      run: ./gradlew build -x test
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v5
      with:
          name: build-libs
          path: build/libs/*.jar
  test:
    runs-on: windows-10
    needs: build

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: chmod for Gradle Wrapper
        run: chmod +x ./gradlew
        
      - name: Run tests
        run: ./gradlew test
        
      
      - name: Check code style with ktlint
        run: ./gradlew ktlintCheck
        
      
